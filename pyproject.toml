[project]
name = "sanad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "iwm10", email = "<number>+iwm10@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sanad = "sanad:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Arabic text is core project data. RUF001-003 flag Arabic letters as
# "ambiguous" look-alikes of Latin characters, which would be pure noise here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
